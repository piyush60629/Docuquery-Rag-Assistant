name: Evaluate RAG

# Run manually from the Actions tab: Evaluate RAG -> Run workflow.
# Needs repository secrets (Settings -> Secrets and variables -> Actions):
#   GEMINI_API_KEY  embeddings (always)
#   GROQ_API_KEY    answers and grading in full mode with llm_provider=groq

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "retrieval = search scores only (about 1 minute). full = also answer quality and refusals (about 8 minutes)"
        type: choice
        options: [retrieval, full]
        default: retrieval
      llm_provider:
        description: "Who writes and grades answers in full mode: groq (open-source models, free tier) or gemini"
        type: choice
        options: [groq, gemini]
        default: groq
      chunking:
        description: "sections = split on headings first (default), fixed = size only (original)"
        type: choice
        options: [sections, fixed]
        default: sections
      chunk_size:
        description: "Chunk size in characters"
        default: "900"
      overlap:
        description: "Chunk overlap in characters"
        default: "150"
      top_k:
        description: "Chunks retrieved per question"
        default: "4"
      label:
        description: "Short note for history.csv, e.g. baseline"
        default: "baseline"
      commit_results:
        description: "Commit results (eval/results and the README table) to this branch"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: evaluate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run evaluation
        timeout-minutes: 20
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_PROVIDER: ${{ inputs.llm_provider }}
          MODE: ${{ inputs.mode }}
          CHUNKING: ${{ inputs.chunking }}
          CHUNK_SIZE: ${{ inputs.chunk_size }}
          OVERLAP: ${{ inputs.overlap }}
          TOP_K: ${{ inputs.top_k }}
          LABEL: ${{ inputs.label }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Add a repository secret named GEMINI_API_KEY first (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          if [ "$MODE" = "full" ] && [ "$LLM_PROVIDER" = "groq" ] && [ -z "$GROQ_API_KEY" ]; then
            echo "::error::Add a repository secret named GROQ_API_KEY first, or run with llm_provider = gemini."
            exit 1
          fi
          set -o pipefail
          if ! python evaluate.py --mode "$MODE" --llm-provider "$LLM_PROVIDER" --chunking "$CHUNKING" --chunk-size "$CHUNK_SIZE" --overlap "$OVERLAP" --top-k "$TOP_K" --label "$LABEL" --update-readme 2>&1 | tee eval-output.log; then
            reason=$(grep -E "Stopped after|could not start|Set GROQ|Error" eval-output.log | tail -2 | tr '\n' ' ')
            echo "::error title=Evaluation failed::${reason:-See the Run evaluation log for details.}"
            exit 1
          fi

      - name: Show results in the run summary
        if: always()
        run: |
          if [ -f eval/results/failed-run/latest.md ]; then
            echo "## Run stopped early (partial results)" >> "$GITHUB_STEP_SUMMARY"
            cat eval/results/failed-run/latest.md >> "$GITHUB_STEP_SUMMARY"
          elif [ -f eval/results/latest.md ]; then
            cat eval/results/latest.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results/
          if-no-files-found: ignore

      - name: Commit results
        if: inputs.commit_results
        env:
          LABEL: ${{ inputs.label }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval/results README.md
          if git diff --cached --quiet; then
            echo "No result changes to commit."
            exit 0
          fi
          git commit -m "Update evaluation results ($LABEL)"
          git push
