name: Keep Streamlit App Awake

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours — safely inside the 12h sleep window
  workflow_dispatch:         # lets you trigger it manually from the Actions tab

jobs:
  wake-app:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit app and click wake button if asleep
        run: |
          python - <<'EOF'
          from playwright.sync_api import sync_playwright

          APP_URL = "https://piyush-docuquery.streamlit.app/"

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(APP_URL, timeout=60000)
              page.wait_for_timeout(5000)

              try:
                  wake_button = page.get_by_text("get this app back up", exact=False)
                  if wake_button.is_visible(timeout=3000):
                      print("App is asleep — clicking wake button...")
                      wake_button.click()
                      page.wait_for_timeout(15000)
                  else:
                      print("App is already awake.")
              except Exception:
                  print("No wake button found — app is likely already awake.")

              page.wait_for_timeout(5000)
              browser.close()
              print("Done.")
          EOF
