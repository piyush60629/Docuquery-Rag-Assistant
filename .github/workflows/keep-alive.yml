name: Keep Streamlit App Awake
 
on:
  schedule:
    # Runs every 10 hours (well within the 12-hour sleep window)
    - cron: '0 */10 * * *'
  workflow_dispatch:  # lets you trigger it manually from the Actions tab to test
 
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          curl -sL -o /dev/null -w "HTTP Status: %{http_code}\n" \
            --max-time 30 \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            https://piyush-docuquery.streamlit.app/
